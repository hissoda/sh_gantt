<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Project Timeline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 400px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: #ffffff;
      color: #333;
      padding: 16px 12px 24px;
      line-height: 1.35;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    /* 제목 */
    .title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .title-bar {
      width: 4px;
      height: 26px;
      background: #5b4fc7;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .title h1 {
      font-size: 22px;
      font-weight: 700;
      color: #2d2d3a;
      letter-spacing: -0.3px;
    }

    /* 레이아웃 */
    .timeline-wrap {
      display: flex;
      gap: 14px;
      width: 100%;
      align-items: flex-start;
    }

    /* 왼쪽 카드 */
    .side {
      flex-shrink: 0;
      width: 142px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-top: 40px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 12px 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
      border: 1px solid #f0f0f5;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 58px;
    }

    .card-icon {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #fff4e6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .card-text {
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.35;
      word-break: keep-all;
    }

    /* 차트 영역 */
    .chart {
      flex: 1;
      min-width: 0;
    }

    .months {
      display: grid;
      grid-template-columns: repeat(18, 1fr);
      margin-bottom: 8px;
      height: 32px;
    }

    .month {
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      color: #666;

      border-radius: 6px;
