<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Project Timeline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: #ffffff;
      color: #333;
      padding: 8px 5px;
      line-height: 1.35;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    .title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }
    .title-bar {
      width: 4px;
      height: 26px;
      background: #5b4fc7;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .title h1 {
      font-size: 22px;
      font-weight: 700;
      color: #2d2d3a;
      letter-spacing: -0.3px;
    }

    /* 항상 가로 배치 유지 */
    .timeline-wrap {
      display: flex;
      gap: 12px;
      width: 100%;
      align-items: flex-start;
    }

    /* 왼쪽 카드 - 최소 너비 보장 */
    .side {
      flex-shrink: 0;
      width: 148px;
      min-width: 136px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-top: 40px;
    }

    .card {
      background: #fff;
 border-radius: 12px;
      padding: 12px 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
      border: 1px solid #f0f0f5;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 58px;
    }

    .card-icon {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #fff4e6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .card-text {
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.35;
      word-break: keep-all;
    }

    .chart {
      flex: 1;
      min-width: 0;
    }

    .months {
      display: grid;
      grid-template-columns: repeat(18, 1fr);
      margin-bottom: 8px;
      height: 32px;
    }

    .month {
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      color: #666;
      background: #f7f7fb;
      border-radius: 6px;
      margin: 0 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 28px;
    }

    .grid {
      position: relative;
      height: 190px;
      background: linear-gradient(to right,
        transparent 0%, transparent calc(100% - 1px), #eee calc(100% - 1px));
      background-size: calc(100% / 18) 100%;
    }

    .row {
      position: absolute;
      left: 0;
      right: 0;
      height: 48px;
    }
    .row:nth-child(1) { top: 6px; }
    .row:nth-child(2) { top: 64px; }
    .row:nth-child(3) { top: 122px; }

    .bar {
      position: absolute;
      height: 34px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      font-size: 12.5px;
      font-weight: 600;
      color: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bar.sky    { background: linear-gradient(90deg, #5b9bd5, #7eb8e8); }
    .bar.yellow { background: linear-gradient(90deg, #f0c14b, #f7d774); color: #333; }
    .bar.pink   { background: linear-gradient(90deg, #e88a9e, #f0a8b8); }

    .years {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 12px;
      color: #999;
      font-weight: 500;
    }

    /* 태블릿 */
    @media (max-width: 820px) {
      .side {
        width: 140px;
        min-width: 132px;
      }
      .card { padding: 11px 10px; min-height: 54px; }
      .card-text { font-size: 12px; }
      .bar { font-size: 12px; padding: 0 8px; }
      .month { font-size: 10px; }
    }

    /* 모바일 - 가로 배치 유지, 카드 위로 올라가지 않음 */
    @media (max-width: 640px) {
      html, body {
        min-height: 10px;
        padding: 5px 8px;
      }

      .title h1 { font-size: 18px; }
      .title { margin-bottom: 14px; }

      .timeline-wrap {
        gap: 8px;
        /* flex-direction 변경 없음 → 카드가 위로 올라가지 않음 */
      }

      .side {
        width: 120px;
        min-width: 112px;
        padding-top: 34px;
        gap: 10px;
      }

      .card {
        padding: 9px 8px;
        min-height: 50px;
        gap: 7px;
      }

      .card-icon {
        width: 26px;
        height: 26px;
        font-size: 13px;
      }

      .card-text {
        font-size: 11px;
        line-height: 1.3;
      }

      .months { height: 28px; margin-bottom: 6px; }
      .month {
        font-size: 9px;
        height: 24px;
        border-radius: 5px;
      }

      .grid { height: 168px; }

      .row { height: 42px; }
      .row:nth-child(1) { top: 4px; }
      .row:nth-child(2) { top: 54px; }
      .row:nth-child(3) { top: 104px; }

      .bar {
        height: 30px;
        font-size: 11px;
        padding: 0 6px;
        border-radius: 7px;
      }

      .years { font-size: 11px; margin-top: 8px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="title">
      <div class="title-bar"></div>
      <h1>PROJECT TIMELINE</h1>
    </div>

    <div class="timeline-wrap">
      <div class="side">
        <div class="card">
          <div class="card-icon">🚗</div>
          <div class="card-text">AI 주차공유<br>플랫폼</div>
        </div>
        <div class="card">
          <div class="card-icon">🏋️</div>
          <div class="card-text">AI 홈트레이닝<br>프로그램</div>
        </div>
        <div class="card">
          <div class="card-icon">🏗️</div>
          <div class="card-text">지하공동구<br>스마트 관리</div>
        </div>
      </div>

      <div class="chart">
        <div class="months">
          <div class="month">9</div><div class="month">10</div><div class="month">11</div><div class="month">12</div>
          <div class="month">1</div><div class="month">2</div><div class="month">3</div><div class="month">4</div>
          <div class="month">5</div><div class="month">6</div><div class="month">7</div><div class="month">8</div>
          <div class="month">9</div><div class="month">10</div><div class="month">11</div><div class="month">12</div>
          <div class="month">1</div><div class="month">2</div><div class="month">3</div><div class="month">4</div>
          <div class="month">5</div><div class="month">6</div>
        </div>

        <div class="grid">
          <div class="row">
            <div class="bar pink" style="left:87.88%; width:30.33%;">PL (7개월)</div>
          </div>
          <div class="row">
            <div class="bar yellow" style="left:44.44%; width:33.33%;">사업기획 (6개월)</div>
          </div>
          <div class="row">
            <div class="bar sky" style="left:0%; width:22%;">산출물 관리 (4개월)</div>
          </div>
        </div>

        <div class="years">
          <span>2020</span>
          <span>2021</span>
          <span>2022</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
